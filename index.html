<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
      crossorigin="anonymous">
      
      
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('calc-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <div class="calculator" role="application" aria-label="Calculator">

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2.5V4.5M12 19.5V21.5M21.5 12H19.5M4.5 12H2.5M18.36 5.64L16.95 7.05M7.05 16.95L5.64 18.36M18.36 18.36L16.95 16.95M7.05 7.05L5.64 5.64" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="display-wrapper">
      <div class="expression" id="expression" aria-live="polite"></div>
      <input
        type="text"
        id="display"
        readonly
        aria-label="Calculator display"
        aria-live="assertive"
        placeholder="0"
      />
    </div>

    <div class="calc-error" id="calcError" role="alert" aria-live="assertive"></div>

    <div class="buttons">

      <button class="btn-func" onclick="clearDisplay()"   aria-label="All clear">AC</button>
      <button class="btn-func" onclick="deleteLast()"     aria-label="Delete last digit">DEL</button>
      <button class="btn-op"   onclick="setOperator('/')" aria-label="Divide">&divide;</button>
      <button class="btn-op"   onclick="setOperator('*')" aria-label="Multiply">&times;</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="btn-op" onclick="setOperator('-')" aria-label="Subtract">&minus;</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="btn-op" onclick="setOperator('+')" aria-label="Add">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="equal" onclick="calculate()" aria-label="Equals">=</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendDecimal()" aria-label="Decimal point">.</button>

    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous"
        ></script>


  <script src="script.js"></script>
</body>
</html>
